<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Action for 2-4 · 同屏派对</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0f14;color:#e8eef2;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
  #wrap{position:relative}
  canvas{display:block;background:#0a0a0a;border:2px solid #2a3644;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.55)}
  .hidden{display:none!important}
  #hud{position:absolute;top:8px;right:8px}
  #hud button{background:#2a3644;color:#e8eef2;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  #hud button:hover{background:#3a4a5c}
  #menu,#result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
                gap:16px;background:rgba(10,15,20,.94);border-radius:8px;text-align:center;padding:20px}
  #menu h1{font-size:32px;letter-spacing:3px}
  #menu h1 span{color:#ffcf3d}
  #menu .sub{font-size:13px;opacity:.7}
  .games{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .games button{background:#1c2836;color:#e8eef2;border:1px solid #3a4a5c;padding:16px 18px;border-radius:12px;
                cursor:pointer;font-size:16px;min-width:118px}
  .games button:hover{background:#27374a;border-color:#5a748e}
  .pcount{display:flex;align-items:center;gap:8px}
  .pcount span{opacity:.7;font-size:13px}
  .pcount button{width:36px;height:36px;border-radius:50%;border:1px solid #3a4a5c;background:#1c2836;color:#e8eef2;cursor:pointer;font-size:15px}
  .pcount button.on{background:#ffcf3d;color:#111;border-color:#ffcf3d}
  .keys{font-size:11px;opacity:.55;max-width:420px;line-height:1.7}
  #result h2{font-size:26px}
  #result p{font-size:15px;opacity:.92;line-height:1.8;white-space:pre-line}
  #result button{background:#ffcf3d;color:#111;border:0;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600}
  #result button+button{background:#2a3644;color:#e8eef2}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="520" height="520"></canvas>
  <div id="hud" class="hidden"><button id="backBtn">← 菜单</button></div>
  <div id="menu">
    <h1>ACTION <span>for 2–4</span></h1>
    <p class="sub">同屏派对 · 参照《Action for 2-4 Players》</p>
    <div class="games">
      <button class="game" data-game="tank">🛡️ 坦克对战</button>
      <button class="game" data-game="soccer">⚽ 桌球足球</button>
      <button class="game" data-game="race">🏎️ 赛车</button>
    </div>
    <div class="pcount">
      <span>人数</span>
      <button data-p="2" class="on">2</button>
      <button data-p="3">3</button>
      <button data-p="4">4</button>
    </div>
    <p class="keys">1P WASD+空格 · 2P 方向键+回车 · 3P IJKL+U · 4P TFGH+R · Esc 返回菜单</p>
  </div>
  <div id="result" class="hidden">
    <h2 id="rTitle"></h2>
    <p id="rText"></p>
    <button id="againBtn">再来一局</button>
    <button id="menuBtn">返回菜单</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const PLAYER_COLORS = ['#ffcf3d','#7ee07e','#ff6b6b','#6ec6ff'];
const PLAYER_NAMES = ['玩家1','玩家2','玩家3','玩家4'];

/* ========== 音效 ========== */
let audioCtx = null;
function beep(freq, dur, type, vol){
  type = type || 'square'; vol = vol || 0.03;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

/* ========== 输入（2~4 人同屏键盘） ========== */
const KEYMAP = {
  KeyW:{p:0,k:'up'},KeyA:{p:0,k:'left'},KeyS:{p:0,k:'down'},KeyD:{p:0,k:'right'},Space:{p:0,k:'fire'},
  ArrowUp:{p:1,k:'up'},ArrowLeft:{p:1,k:'left'},ArrowDown:{p:1,k:'down'},ArrowRight:{p:1,k:'right'},Enter:{p:1,k:'fire'},
  KeyI:{p:2,k:'up'},KeyJ:{p:2,k:'left'},KeyK:{p:2,k:'down'},KeyL:{p:2,k:'right'},KeyU:{p:2,k:'fire'},
  KeyT:{p:3,k:'up'},KeyF:{p:3,k:'left'},KeyG:{p:3,k:'down'},KeyH:{p:3,k:'right'},KeyR:{p:3,k:'fire'},
};
const input = Array.from({length:4}, () => ({up:false,down:false,left:false,right:false,fire:false}));
const PREVENT = new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter']);
addEventListener('keydown', e => {
  const m = KEYMAP[e.code]; if (!m) return;
  if (PREVENT.has(e.code)) e.preventDefault();
  input[m.p][m.k] = true;
});
addEventListener('keyup', e => {
  const m = KEYMAP[e.code]; if (!m) return;
  input[m.p][m.k] = false;
});
addEventListener('keydown', e => { if (e.code === 'Escape' && app.state !== 'menu') toMenu(); });

/* ========== 通用工具 ========== */
function rectOverlap(ax,ay,aw,ah,bx,by,bw,bh){ return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by; }
const fx = [];
function boom(x, y, color){ fx.push({x,y,r:6,life:18,max:18,color}); }
function updateFx(){ for (const f of fx){ f.r += 1.6; f.life--; } for (let i=fx.length-1;i>=0;i--) if (fx[i].life<=0) fx.splice(i,1); }
function drawFx(){ for (const f of fx){ ctx.globalAlpha=f.life/f.max; ctx.strokeStyle=f.color; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.stroke(); } ctx.globalAlpha=1; }

/* ========== 应用状态 ========== */
const app = { state:'menu', game:null, players:2 };
let lastGame = null;
const menuEl = document.getElementById('menu'), resultEl = document.getElementById('result'),
      hudEl = document.getElementById('hud'), rTitle = document.getElementById('rTitle'), rText = document.getElementById('rText');
function show(el){ el.classList.remove('hidden'); }
function hide(el){ el.classList.add('hidden'); }
function resetInput(){ for (const i of input) i.up=i.down=i.left=i.right=i.fire=false; }
function finish(title, text){ app.state='result'; rTitle.textContent=title; rText.textContent=text; hide(hudEl); show(resultEl); }
function startGame(name){
  lastGame = name;
  app.game = GAMES[name]; app.state = 'playing';
  app.game.init(app.players);
  resetInput();
  hide(menuEl); hide(resultEl); show(hudEl);
  if (document.activeElement) document.activeElement.blur();
}
function toMenu(){ app.state='menu'; app.game=null; resetInput(); hide(hudEl); hide(resultEl); show(menuEl); }

/* ========== 游戏一：坦克对战（互射，先到 7 分） ========== */
const TANK_SIZE = 30, TANK_SPEED = 2.2, BULLET_SPEED = 6;
function tankBricks(){
  const t = 40, R = [], add = (gx,gy) => R.push({x:gx*t+5, y:gy*t+5, w:t-10, h:t-10});
  add(1,1); add(2,1); add(1,2);
  add(10,1); add(11,1); add(11,2);
  add(1,10); add(1,11); add(2,11);
  add(10,11); add(11,11); add(11,10);
  add(3,3); add(9,3); add(3,9); add(9,9);
  add(6,3); add(6,9); add(3,6); add(9,6);
  add(6,6);
  return R;
}
function drawTank(x, y, dir, color){
  const s = TANK_SIZE;
  ctx.save(); ctx.translate(x+s/2, y+s/2); ctx.rotate(dir*Math.PI/2);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(-s/2,-s/2,s/2-3,s); ctx.fillRect(3,-s/2,s/2-3,s);
  ctx.fillStyle=color; ctx.fillRect(-s/2+2,-s/2+2,s-4,s-4);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(-6,-6,12,12);
  ctx.fillStyle='#222'; ctx.fillRect(-2,-s/2-7,4,9);
  ctx.restore();
}
function drawBrickRect(w){ ctx.fillStyle='#a4552d'; ctx.fillRect(w.x,w.y,w.w,w.h); ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.strokeRect(w.x,w.y,w.w,w.h); }
function drawBullet(b){ ctx.fillStyle='#fff'; ctx.fillRect(b.x,b.y,4,4); }

const TankGame = {
  title:'🛡️ 坦克对战', win:7,
  init(n){
    this.n = n; this.scores = Array(n).fill(0); this.winner = null; this.round = 1; fx.length = 0;
    this.newRound();
  },
  newRound(){
    this.walls = tankBricks(); this.bullets = []; this.tanks = [];
    const sp = [[90,90],[W-90-TANK_SIZE,90],[90,H-90-TANK_SIZE],[W-90-TANK_SIZE,H-90-TANK_SIZE]];
    for (let i=0;i<this.n;i++) this.tanks.push({i, x:sp[i][0], y:sp[i][1], dir:0, color:PLAYER_COLORS[i], alive:true, cd:0});
  },
  collides(t){
    const m = 8;
    if (t.x<m || t.y<m || t.x+TANK_SIZE>W-m || t.y+TANK_SIZE>H-m) return true;
    for (const w of this.walls) if (rectOverlap(t.x,t.y,TANK_SIZE,TANK_SIZE,w.x,w.y,w.w,w.h)) return true;
    for (const o of this.tanks) if (o!==t && o.alive && rectOverlap(t.x,t.y,TANK_SIZE,TANK_SIZE,o.x,o.y,TANK_SIZE,TANK_SIZE)) return true;
    return false;
  },
  move(t, dir){
    const d = [[0,-1],[1,0],[0,1],[-1,0]][dir];
    t.x += d[0]*TANK_SPEED; if (this.collides(t)) t.x -= d[0]*TANK_SPEED;
    t.y += d[1]*TANK_SPEED; if (this.collides(t)) t.y -= d[1]*TANK_SPEED;
  },
  shoot(t){
    const d = [[0,-1],[1,0],[0,1],[-1,0]][t.dir];
    const cx = t.x+TANK_SIZE/2, cy = t.y+TANK_SIZE/2;
    this.bullets.push({x:cx-2+d[0]*(TANK_SIZE/2+2), y:cy-2+d[1]*(TANK_SIZE/2+2), dx:d[0]*BULLET_SPEED, dy:d[1]*BULLET_SPEED, owner:t.i});
    beep(660,0.06,'square',0.03);
  },
  update(){
    for (const t of this.tanks){
      if (!t.alive) continue;
      const k = input[t.i];
      if (k.up) t.dir=0; else if (k.down) t.dir=2; else if (k.left) t.dir=3; else if (k.right) t.dir=1;
      if (k.up||k.down||k.left||k.right) this.move(t, t.dir);
      t.cd = Math.max(0, t.cd-1);
      if (k.fire && t.cd===0){ this.shoot(t); t.cd=14; }
    }
    for (const b of this.bullets){
      b.x += b.dx; b.y += b.dy;
      for (let i=this.walls.length-1;i>=0;i--){
        const w = this.walls[i];
        if (rectOverlap(b.x,b.y,4,4,w.x,w.y,w.w,w.h)){ this.walls.splice(i,1); b.dead=true; break; }
      }
      if (b.dead) continue;
      for (const t of this.tanks){
        if (!t.alive || t.i===b.owner) continue;
        if (rectOverlap(b.x,b.y,4,4,t.x,t.y,TANK_SIZE,TANK_SIZE)){
          t.alive=false; b.dead=true; boom(t.x+TANK_SIZE/2, t.y+TANK_SIZE/2, t.color); beep(140,0.3,'sawtooth',0.08); break;
        }
      }
      if (b.dead) continue;
      if (b.x<-4 || b.y<-4 || b.x>W+4 || b.y>H+4) b.dead=true;
    }
    this.bullets = this.bullets.filter(b => !b.dead);
    const alive = this.tanks.filter(t => t.alive);
    if (alive.length <= 1){
      if (alive.length === 1) this.scores[alive[0].i]++;
      const w = this.scores.findIndex(s => s >= this.win);
      if (w >= 0){ this.winner = w; finish(this.title, this.resultText(w)); }
      else { this.round++; this.newRound(); }
    }
  },
  resultText(w){
    let s = '';
    for (let i=0;i<this.n;i++) s += (i===w?'🏆 ':'') + PLAYER_NAMES[i] + '：' + this.scores[i] + ' 分\n';
    return PLAYER_NAMES[w] + ' 率先拿到 ' + this.win + ' 分获胜！\n' + s;
  },
  draw(){
    ctx.fillStyle='#0b0b0b'; ctx.fillRect(0,0,W,H);
    for (const w of this.walls) drawBrickRect(w);
    for (const b of this.bullets) drawBullet(b);
    for (const t of this.tanks) if (t.alive) drawTank(t.x,t.y,t.dir,t.color);
    this.drawHUD();
  },
  drawHUD(){
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(0,0,W,26);
    let x = 10;
    for (let i=0;i<this.n;i++){
      ctx.fillStyle=PLAYER_COLORS[i]; ctx.fillRect(x,8,10,10);
      ctx.fillStyle='#fff'; ctx.font='12px system-ui'; ctx.fillText(this.scores[i], x+14, 17);
      x += 34;
    }
  }
};

/* ========== 游戏二：桌球足球（1v1 / 2v2） ========== */
const SoccerGame = {
  title:'⚽ 桌球足球', win:5,
  init(n){
    this.n = (n === 3) ? 2 : n;
    this.teams = (this.n === 2) ? [0,1] : [0,0,1,1];
    this.score = [0,0]; this.winner = null; fx.length = 0;
    this.reset();
  },
  reset(){
    this.ball = {x:W/2, y:H/2, vx:0, vy:0, r:11};
    this.players = [];
    for (let i=0;i<this.n;i++){
      const left = this.teams[i] === 0, r = 16;
      const x = left ? W*0.28 : W*0.72;
      let y;
      if (this.n === 2) y = H/2;
      else { const j = i<2 ? i : i-2; y = (j===0) ? H*0.32 : H*0.68; }
      this.players.push({i, x, y, r, color:PLAYER_COLORS[i], left});
    }
  },
  update(){
    for (const p of this.players){
      const k = input[p.i];
      let dx = (k.right?1:0) - (k.left?1:0), dy = (k.down?1:0) - (k.up?1:0);
      if (dx || dy){ const l = Math.hypot(dx,dy); p.x += dx/l*3; p.y += dy/l*3; }
      if (p.left) p.x = Math.max(8, Math.min(W/2 - p.r, p.x));
      else p.x = Math.max(W/2 + p.r, Math.min(W-8, p.x));
      p.y = Math.max(p.r, Math.min(H - p.r, p.y));
      this.kick(p);
    }
    const b = this.ball;
    b.x += b.vx; b.y += b.vy; b.vx *= 0.985; b.vy *= 0.985;
    if (b.y < b.r){ b.y = b.r; b.vy *= -0.85; }
    if (b.y > H - b.r){ b.y = H - b.r; b.vy *= -0.85; }
    const g0 = H/2 - 70, g1 = H/2 + 70;
    if (b.x < b.r){
      if (b.y > g0 && b.y < g1){ if (b.x < -b.r) return this.goal(1); }
      else { b.x = b.r; b.vx *= -0.85; }
    }
    if (b.x > W - b.r){
      if (b.y > g0 && b.y < g1){ if (b.x > W + b.r) return this.goal(0); }
      else { b.x = W - b.r; b.vx *= -0.85; }
    }
  },
  kick(p){
    const b = this.ball, d = Math.hypot(b.x-p.x, b.y-p.y), min = p.r + b.r;
    if (d < min && d > 0.001){
      const nx = (b.x-p.x)/d, ny = (b.y-p.y)/d;
      b.x = p.x + nx*min; b.y = p.y + ny*min;
      b.vx = nx*7; b.vy = ny*7;
    }
  },
  goal(team){
    this.score[team]++; beep(520,0.2,'square',0.05);
    if (this.score[team] >= this.win){ this.winner = team; finish(this.title, this.resultText()); }
    else this.reset();
  },
  resultText(){
    const w = this.winner === 0 ? (this.n===2 ? PLAYER_NAMES[0] : '左队') : (this.n===2 ? PLAYER_NAMES[1] : '右队');
    return w + ' 率先拿到 ' + this.win + ' 分获胜！\n左 ' + this.score[0] + ' : ' + this.score[1] + ' 右';
  },
  draw(){
    ctx.fillStyle='#0d2810'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=3;
    ctx.strokeRect(2,2,W-4,H-4);
    ctx.beginPath(); ctx.moveTo(W/2,2); ctx.lineTo(W/2,H-2); ctx.stroke();
    ctx.beginPath(); ctx.arc(W/2,H/2,52,0,7); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fillRect(0,H/2-70,10,140); ctx.fillRect(W-10,H/2-70,10,140);
    for (const p of this.players){ ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=2; ctx.stroke(); }
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(this.ball.x,this.ball.y,this.ball.r,0,7); ctx.fill();
    ctx.strokeStyle='#999'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(this.ball.x,this.ball.y,this.ball.r*0.5,0,7); ctx.stroke();
    this.drawHUD();
  },
  drawHUD(){
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(0,0,W,26);
    ctx.fillStyle=PLAYER_COLORS[0]; ctx.fillRect(W/2-70,8,10,10);
    ctx.fillStyle=PLAYER_COLORS[1]; ctx.fillRect(W/2+60,8,10,10);
    ctx.fillStyle='#fff'; ctx.font='bold 14px system-ui'; ctx.textAlign='center';
    ctx.fillText(this.score[0] + ' : ' + this.score[1], W/2, 18);
    ctx.textAlign='left';
  }
};

/* ========== 游戏三：赛车（3 圈） ========== */
const RaceGame = {
  title:'🏎️ 赛车', laps:3,
  init(n){
    this.n = n; this.winner = null; fx.length = 0; this.cars = [];
    const st = [[W/2-45,H-70],[W/2+45,H-70],[W/2-45,H-35],[W/2+45,H-35]];
    for (let i=0;i<n;i++) this.cars.push({i, x:st[i][0], y:st[i][1], a:-Math.PI/2, v:0, lap:0, canLap:false, color:PLAYER_COLORS[i]});
    this.island = {x:150, y:150, w:220, h:220};
  },
  update(){
    for (const c of this.cars){
      const k = input[c.i];
      if (k.left) c.a -= 0.055;
      if (k.right) c.a += 0.055;
      if (k.up) c.v += 0.18; else if (k.down) c.v -= 0.25; else c.v *= 0.985;
      c.v = Math.max(-2, Math.min(4.2, c.v));
      c.x += Math.cos(c.a)*c.v; c.y += Math.sin(c.a)*c.v;
      this.collide(c);
      if (c.y < 30 && c.canLap){ c.lap++; c.canLap=false; beep(880,0.08,'square',0.05); if (c.lap >= this.laps) this.endRace(); }
      if (c.y > H-30) c.canLap = true;
    }
  },
  collide(c){
    const r = 13;
    if (c.x < r){ c.x = r; c.v *= -0.4; }
    if (c.x > W-r){ c.x = W-r; c.v *= -0.4; }
    if (c.y < r){ c.y = r; c.v *= -0.4; }
    if (c.y > H-r){ c.y = H-r; c.v *= -0.4; }
    const I = this.island, L = I.x-r, R = I.x+I.w+r, T = I.y-r, B = I.y+I.h+r;
    if (c.x>L && c.x<R && c.y>T && c.y<B){
      const dl=c.x-L, dr=R-c.x, dt=c.y-T, db=B-c.y, m=Math.min(dl,dr,dt,db);
      if (m===dl) c.x=L; else if (m===dr) c.x=R; else if (m===dt) c.y=T; else c.y=B;
      c.v *= -0.4;
    }
  },
  endRace(){
    if (this.winner !== null) return;
    const sorted = [...this.cars].sort((a,b) => b.lap - a.lap || b.y - a.y);
    this.winner = sorted[0].i;
    let s = '';
    sorted.forEach((c,idx) => { s += (idx===0?'🏆 ':'') + PLAYER_NAMES[c.i] + '：' + Math.min(c.lap,this.laps) + ' 圈\n'; });
    finish(this.title, PLAYER_NAMES[this.winner] + ' 率先完成 ' + this.laps + ' 圈！\n' + s);
  },
  draw(){
    ctx.fillStyle='#122a12'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=3; ctx.strokeRect(10,10,W-20,H-20);
    const I = this.island;
    ctx.fillStyle='#0b1c0b'; ctx.fillRect(I.x,I.y,I.w,I.h);
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.strokeRect(I.x,I.y,I.w,I.h);
    ctx.fillStyle='#fff';
    for (let x=0;x<W;x+=24) ctx.fillRect(x,26,12,6);
    ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.setLineDash([10,10]);
    ctx.beginPath(); ctx.moveTo(0,H-30); ctx.lineTo(W,H-30); ctx.stroke(); ctx.setLineDash([]);
    for (const c of this.cars) this.drawCar(c);
    this.drawHUD();
  },
  drawCar(c){
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.a);
    ctx.fillStyle=c.color; ctx.fillRect(-9,-14,18,28);
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(-9,-14,18,10);
    ctx.fillStyle='#111'; ctx.fillRect(-3,-5,6,10);
    ctx.restore();
  },
  drawHUD(){
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(0,0,W,26);
    let x = 10;
    for (let i=0;i<this.n;i++){
      ctx.fillStyle=PLAYER_COLORS[i]; ctx.fillRect(x,8,10,10);
      ctx.fillStyle='#fff'; ctx.font='12px system-ui'; ctx.fillText(Math.min(this.cars[i].lap,this.laps)+'/'+this.laps, x+14, 17);
      x += 44;
    }
  }
};

/* ========== 菜单与启动 ========== */
const GAMES = { tank:TankGame, soccer:SoccerGame, race:RaceGame };
let chosenPlayers = 2;
document.querySelectorAll('.pcount button').forEach(btn => {
  btn.onclick = () => {
    chosenPlayers = +btn.dataset.p;
    document.querySelectorAll('.pcount button').forEach(b => b.classList.toggle('on', b === btn));
  };
});
document.querySelectorAll('.game').forEach(btn => {
  btn.onclick = () => { app.players = chosenPlayers; startGame(btn.dataset.game); };
});
document.getElementById('backBtn').onclick = toMenu;
document.getElementById('menuBtn').onclick = toMenu;
document.getElementById('againBtn').onclick = () => { if (lastGame) startGame(lastGame); };

function drawMenuBg(){
  ctx.fillStyle='#0a0a0a'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1;
  for (let x=0;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0;y<H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}
function tick(){
  if (app.state === 'playing' && app.game){
    app.game.update();
    updateFx();
    app.game.draw();
    drawFx();
  } else if (app.state === 'menu'){
    drawMenuBg();
  }
  // result 状态：保持上一帧画面
}
// 固定 60 步/秒：适配高刷屏，避免倍速
const STEP_MS = 1000/60;
let lastTime = performance.now(), acc = 0;
function loop(now){
  acc += now - lastTime; lastTime = now;
  if (acc > 1000) acc = 1000;
  let n = 0;
  while (acc >= STEP_MS && n < 4){ tick(); acc -= STEP_MS; n++; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
